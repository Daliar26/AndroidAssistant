name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Установка именно этой версии Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9' # Попробуем вернуть 8.9, так как новый build.gradle должен работать с ней

      # ВАЖНО: Используем ./gradlew, если бы он был, но у нас его нет.
      # Поэтому запускаем системную команду gradle, которую поставил setup-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
        
      - name: Build with Gradle
        # Запускаем сборку. Флаг --no-daemon помогает избежать проблем с демонами в CI
        run: gradle assembleDebug --no-daemon --stacktrace
