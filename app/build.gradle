plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daliar26.subtitles'
    compileSdk 35

    defaultConfig {
        applicationId 'com.daliar26.subtitles'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { jniLibs { useLegacyPackaging true } }
}

// Vosk pulls legacy Kotlin JDK7/JDK8 adapter artifacts (1.6.21).
// Their classes are already included in kotlin-stdlib 1.8.22,
// so exclude the old adapter JARs to prevent duplicate classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.google.mlkit:translate:17.0.3'
}
